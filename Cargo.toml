[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Yalla Nkardaz"]
license = "MIT"
categories = []
keywords = []
homepage = "https://github.com/Lampadion"
repository = "https://github.com/Lampadion/Core"

[workspace.dependencies]
# Workspace
dataconv = { path = "crates/dataconv" }
# Unicode
icu = { version = "2", features = ["compiled_data", "serde", "sync"] }
# Input
keytap = "0.4" # For keyboard input
imekit = "0.2" # For IME: forge, vietnamese, pinyin etc.
# Data
serde = { version = "1", features = ["derive"] }
ron = "0.12.2"
# Localization
fluent = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
collapsible_if = "warn"
