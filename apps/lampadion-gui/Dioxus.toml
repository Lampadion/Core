[application]
name = "lampadion-gui"
default_platform = "desktop"

[bundle]
identifier = "com.nkardaz.lampadion"
publisher = "Yalla Nkardaz"

copyright = "Copyright © 2026 Yalla Nkardaz"
category = "Utility"

short_description = "A Unicode text input and composition utility."
long_description = """
Lampadion is a cross-platform text input utility
providing customizable input methods, Unicode composition,
and multilingual character input.
"""

icon = [
  "apps/lampadion-gui/assets/graphics/icons/bundle/icon_32x32.png",
  "apps/lampadion-gui/assets/graphics/icons/bundle/icon_128x128.png",
  "apps/lampadion-gui/assets/graphics/icons/bundle/icon_256x256.png",
  "apps/lampadion-gui/assets/graphics/icons/bundle/icon_512x512.png",
  "apps/lampadion-gui/assets/graphics/icons/bundle/icon.ico",
  "apps/lampadion-gui/assets/graphics/icons/bundle/icon.icns",
]

[web.app]

# HTML title tag content
title = "lampadion-gui"

# include `assets` in web platform
[web.resource]

[web.watcher]
reload_html = true

watch_path = ["apps/lampadion-gui/assets", "apps/lampadion-gui/src", "apps/lampadion-gui/Cargo.toml"]

# Additional CSS style files
style = []

# Additional JavaScript files
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []
